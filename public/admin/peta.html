<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Interaktif - Admin CoastAlert</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/admin.css?v=3" />
  <link rel="stylesheet" href="css/dashboard.css?v=3" />
</head>
<body class="db-body">

  <!-- Ikon bersama marker, filter, dan legenda (sama dengan peta publik) -->
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="ikon-rob" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9c2.2 0 2.2-2 4.5-2S9.8 9 12 9s2.2-2 4.5-2S18.8 9 21 9" />
        <path d="M3 15c2.2 0 2.2-2 4.5-2S9.8 15 12 15s2.2-2 4.5-2S18.8 15 21 15" />
      </g>
    </symbol>
    <symbol id="ikon-abrasi" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3.5c3.2 3 3.2 5.2 1 8.2s-2.2 5.2 1 8.2" />
        <path d="M14 7.5c1.6 0 1.6-1.4 3.2-1.4s1.6 1.4 3.2 1.4" />
        <path d="M14 12.5c1.6 0 1.6-1.4 3.2-1.4s1.6 1.4 3.2 1.4" />
        <path d="M14 17.5c1.6 0 1.6-1.4 3.2-1.4s1.6 1.4 3.2 1.4" />
      </g>
    </symbol>
    <symbol id="ikon-laporan" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5h16v10H8l-4 3z" />
        <path d="M8 9h8M8 12h5" />
      </g>
    </symbol>
  </svg>

  <!-- ===== NAVBAR ===== -->
  <header id="navbarAdmin"></header>

  <!-- ===== KONTEN UTAMA ===== -->
  <div class="db-wrapper">

    <!-- Page Header -->
    <div class="db-page-header">
      <div>
        <h1 class="db-page-title">Peta Interaktif</h1>
        <p class="db-page-sub">Sebaran titik rawan rob &amp; abrasi pesisir Kota Bengkulu</p>
      </div>
    </div>

    <!-- Kotak Khusus Peta & Filter -->
    <div class="db-card db-card-peta-kotak">
      <div class="admin-peta-layout">

        <!-- Panel Filter Samping -->
        <aside class="panel-peta-admin">
          <div class="kartu" style="box-shadow:none;padding:0">
            <h2>Filter Peta</h2>

            <div class="baris">
              <label for="filterJenis">Kategori bencana</label>
              <select id="filterJenis">
                <option value="">Semua kategori</option>
                <option value="rob">Banjir Rob</option>
                <option value="abrasi">Abrasi Pantai</option>
              </select>
            </div>

            <div class="baris">
              <label for="filterKecamatan">Kecamatan</label>
              <select id="filterKecamatan">
                <option value="">Semua kecamatan</option>
              </select>
            </div>

            <div class="baris">
              <label>Tingkat kerawanan</label>
              <label class="cek"><input type="checkbox" class="filter-kategori" value="Rendah" checked /> <span class="dot dot-risiko-rendah"></span> Rendah</label>
              <label class="cek"><input type="checkbox" class="filter-kategori" value="Sedang" checked /> <span class="dot dot-risiko-sedang"></span> Sedang</label>
              <label class="cek"><input type="checkbox" class="filter-kategori" value="Tinggi" checked /> <span class="dot dot-risiko-tinggi"></span> Tinggi</label>
            </div>

            <div class="baris">
              <label for="cariTitik">Cari nama lokasi</label>
              <input type="text" id="cariTitik" placeholder="contoh: Penurunan, Jakat..." />
            </div>

            <button class="tombol sekunder penuh" id="resetFilter">Reset filter</button>
          </div>

          <div class="kartu" style="box-shadow:none;padding:0">
            <h3>Tampilkan layer</h3>
            <label class="cek"><input type="checkbox" id="layerRob" checked /> <span class="legenda-penanda legenda-penanda-rob" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#ikon-rob"></use></svg></span> Banjir rob</label>
            <label class="cek"><input type="checkbox" id="layerAbrasi" checked /> <span class="legenda-penanda legenda-penanda-abrasi" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#ikon-abrasi"></use></svg></span> Abrasi</label>
            <label class="cek"><input type="checkbox" id="layerLaporan" checked /> <span class="legenda-bentuk laporan" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#ikon-laporan"></use></svg></span> Laporan warga</label>
            <label class="cek"><input type="checkbox" id="layerBnpb" /> <span class="dot dot-bnpb"></span> Zona bahaya BNPB</label>
          </div>

          <div class="kartu" style="box-shadow:none;padding:0">
            <h3>Daftar titik <span class="tag-kecil" id="jumlahTitik"></span></h3>
            <div id="daftarTitik"></div>
          </div>
        </aside>

        <!-- Wadah Peta (Kotak Khusus) -->
        <div class="peta-admin-wadah">
          <div id="petaAdmin" class="peta-admin"></div>
        </div>

      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/admin-peta.js?v=3"></script>
</body>
</html>
